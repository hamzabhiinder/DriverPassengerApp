name: driver_passenger_app
description: "Driver and passenger ride app — GetX modular architecture."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  shared_preferences: ^2.5.3
  google_fonts: ^8.2.1
  flutter_map: ^8.1.1
  latlong2: ^0.10.1
  avatar_glow: ^3.0.1
  flutter_screenutil: ^5.9.3
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  lucide_icons_flutter: ^3.1.20

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist[wght].ttf
